<svg xmlns="http://www.w3.org/2000/svg" viewBox="256 404 403 655">
<!-- midi mark (placeholder): line portrait of Ahmad Hamidi with "midi" lettering.
     To replace it, overwrite this file; the site picks it up everywhere. -->
<defs>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="slow"/>
      <feDisplacementMap in="SourceGraphic" in2="slow" scale="9" xChannelSelector="R" yChannelSelector="G" result="w"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="9" result="fine"/>
      <feDisplacementMap in="w" in2="fine" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- wet ink: strokes melt together and pool at joins and ends, then get a light rough edge -->
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.137  0 0 0 0 0.137  0 0 0 0 0.137  0 0 0 26 -11" result="goo"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="6" result="slow"/>
      <feDisplacementMap in="goo" in2="slow" scale="6" xChannelSelector="R" yChannelSelector="G" result="w"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="1" seed="11" result="fine"/>
      <feDisplacementMap in="w" in2="fine" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- "midi" lettering, drawn upright on a 1060 baseline; slanted where it's used -->
    <g id="midi">
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        <!-- m -->
        <path stroke-width="34" d="M262 968 C266 995 262 1030 255 1058"/>
        <path stroke-width="19" d="M262 990 C278 958 308 950 316 975"/>
        <path stroke-width="32" d="M316 975 C322 1002 315 1034 311 1056"/>
        <path stroke-width="19" d="M318 994 C334 960 364 952 372 980"/>
        <path stroke-width="32" d="M372 980 C378 1010 372 1038 380 1054 C386 1066 398 1066 410 1050"/>
        <!-- i -->
        <path stroke-width="32" d="M440 975 C443 1000 436 1030 440 1050 C444 1066 457 1066 468 1054"/>
        <path stroke-width="23" d="M444 928 C448 920 454 912 460 906"/>
        <!-- d -->
        <path stroke-width="31" d="M560 990 C542 962 500 962 491 1003 C484 1042 514 1068 543 1046 C558 1034 565 1012 566 990"/>
        <path stroke-width="32" d="M581 872 C577 922 568 980 567 1028 C566 1058 581 1066 598 1050"/>
        <!-- i with an accent for a dot -->
        <path stroke-width="32" d="M622 975 C625 1000 618 1030 622 1050 C626 1066 639 1066 651 1053"/>
        <path stroke-width="22" d="M630 930 C637 918 645 906 654 895"/>
      </g>
      <g fill="#000">
        <circle cx="256" cy="1059" r="20"/>
        <circle cx="311" cy="1057" r="19"/>
        <circle cx="412" cy="1048" r="15"/>
        <circle cx="470" cy="1052" r="15"/>
        <circle cx="581" cy="874" r="19"/>
        <circle cx="600" cy="1048" r="15"/>
        <circle cx="653" cy="1051" r="15"/>
        <circle cx="461" cy="905" r="16"/>
        <circle cx="655" cy="894" r="15"/>
      </g>
    </g>

    <!-- portrait A, without the shoulder flick; the neck ends are set per layout -->
    <g id="face">
      <g fill="none" stroke="#232323" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.5">
        <path d="M455 428 C430 420 400 424 378 432 C352 440 335 452 318 470 C300 490 285 510 276 535 C266 562 262 592 264 622 C266 652 272 680 284 700 C290 710 296 718 302 724"/>
        <path d="M455 428 C485 422 520 430 548 450 C575 470 595 500 604 535 C612 570 612 610 606 648 C601 680 592 705 580 722 C584 745 580 768 568 788"/>
        <path d="M440 438 C405 440 365 462 338 495 C316 522 304 560 302 600"/>
        <path d="M470 440 C510 448 545 475 565 515 C578 545 582 585 578 625"/>
        <path d="M456 436 C440 462 410 488 385 510 C365 530 352 560 350 612"/>
        <path d="M448 450 C430 480 410 505 396 540"/>
        <path d="M458 438 C480 462 515 485 537 520 C548 540 553 565 555 600"/>
        <path d="M378 432 C371 424 362 421 353 423"/>
        <path d="M592 712 C598 735 596 760 586 780"/>
        <path d="M290 712 C286 730 290 745 298 758"/>
        <path d="M306 650 C305 700 316 760 340 805 C362 840 398 860 435 862 C470 862 505 845 530 815 C548 790 556 740 558 688"/>
        <path d="M303 690 C289 688 284 705 290 722 C295 735 305 740 312 738"/>
        <path d="M557 688 C572 684 580 700 574 718 C570 732 562 738 552 736"/>
        <path d="M325 590 C348 583 380 582 404 590 C410 622 413 662 403 698 C398 710 411 716 424 710"/>
        <path d="M464 588 C488 582 515 583 540 592"/>
        <path d="M459 704 C468 711 479 706 477 696"/>
        <path d="M346 624 C360 614 385 614 399 623"/>
        <path d="M354 630 C366 634 382 634 392 630" stroke-width="5.5"/>
        <path d="M464 623 C478 614 503 614 518 623"/>
        <path d="M471 630 C482 634 499 634 510 630" stroke-width="5.5"/>
        <path d="M393 748 L401 744 M410 745 L418 742 M450 742 L458 745 M467 744 L475 748" stroke-width="5.5"/>
        <path d="M380 768 C398 762 418 766 433 764 C448 766 468 762 488 767"/>
        <path d="M408 757 C420 752 428 755 433 758 C440 754 450 752 462 757" stroke-width="4.5"/>
        <path d="M402 784 C420 792 448 792 466 784"/>
        <path d="M424 808 C431 814 441 814 448 808"/>
        <path d="M398 836 L402 842 M470 836 L466 842" stroke-width="5.5"/>
      </g>
      <g fill="#232323">
        <path class="pupil" d="M364 621 a7.5 7.5 0 0 0 15 0 Z"/>
        <path class="pupil" d="M485 621 a7.5 7.5 0 0 0 15 0 Z"/>
      </g>
    </g>
  </defs>
<g filter="url(#brush)">
    <use href="#face"/>
    <g fill="none" stroke="#232323" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.5">
      <path d="M338 818 C340 860 343 905 345 975"/>
      <path d="M532 812 C530 855 530 900 528 965"/>
    </g>
  </g>
  <g transform="translate(440 1030) scale(0.8) translate(-440 -1060) translate(0 1060) skewX(-11) translate(0 -1060) translate(-16 0)" filter="url(#ink)">
    <use href="#midi"/>
  </g>
</svg>
