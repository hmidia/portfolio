<svg xmlns="http://www.w3.org/2000/svg" viewBox="244 403 387 589">
<!-- midi mark (placeholder): brush line portrait of Ahmad Hamidi.
     Paths with class="pupil" follow the cursor on the site; groups with class="strand"
     sway in a light breeze. To replace the drawing, overwrite this file; without those
     classes it simply shows as a still image. -->
<style>
  /* each stray strand swings from its root, slowly and out of step with the others */
  .strand{transform-box:fill-box;animation:breeze 6s ease-in-out infinite}
  .strand--crown{transform-origin:100% 100%;animation-duration:5.2s}
  .strand--right{transform-origin:40% 0;animation-duration:6.4s;animation-delay:-1.8s}
  .strand--left{transform-origin:60% 0;animation-duration:7s;animation-delay:-3.1s;animation-direction:alternate-reverse}
  @keyframes breeze{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @media (prefers-reduced-motion:reduce){.strand{animation:none}}
</style>
  <defs>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="slow"/>
      <feDisplacementMap in="SourceGraphic" in2="slow" scale="9" xChannelSelector="R" yChannelSelector="G" result="w"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="9" result="fine"/>
      <feDisplacementMap in="w" in2="fine" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <g id="face">
      <g fill="none" stroke="#232323" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.5">
        <path d="M455 428 C430 420 400 424 378 432 C352 440 335 452 318 470 C300 490 285 510 276 535 C266 562 262 592 264 622 C266 652 272 680 284 700 C290 710 296 718 302 724"/>
        <path d="M455 428 C485 422 520 430 548 450 C575 470 595 500 604 535 C612 570 612 610 606 648 C601 680 592 705 580 722 C584 745 580 768 568 788"/>
        <path d="M440 438 C405 440 365 462 338 495 C316 522 304 560 302 600"/>
        <path d="M470 440 C510 448 545 475 565 515 C578 545 582 585 578 625"/>
        <path d="M456 436 C440 462 410 488 385 510 C365 530 352 560 350 612"/>
        <path d="M448 450 C430 480 410 505 396 540"/>
        <path d="M458 438 C480 462 515 485 537 520 C548 540 553 565 555 600"/>
        <path d="M306 650 C305 700 316 760 340 805 C362 840 398 860 435 862 C470 862 505 845 530 815 C548 790 556 740 558 688"/>
        <path d="M303 690 C289 688 284 705 290 722 C295 735 305 740 312 738"/>
        <path d="M557 688 C572 684 580 700 574 718 C570 732 562 738 552 736"/>
        <path d="M325 590 C348 583 380 582 404 590 C410 622 413 662 403 698 C398 710 411 716 424 710"/>
        <path d="M464 588 C488 582 515 583 540 592"/>
        <path d="M459 704 C468 711 479 706 477 696"/>
        <path d="M346 624 C360 614 385 614 399 623"/>
        <path d="M354 630 C366 634 382 634 392 630" stroke-width="5.5"/>
        <path d="M464 623 C478 614 503 614 518 623"/>
        <path d="M471 630 C482 634 499 634 510 630" stroke-width="5.5"/>
        <path d="M393 748 L401 744 M410 745 L418 742 M450 742 L458 745 M467 744 L475 748" stroke-width="5.5"/>
        <path d="M380 768 C398 762 418 766 433 764 C448 766 468 762 488 767"/>
        <path d="M408 757 C420 752 428 755 433 758 C440 754 450 752 462 757" stroke-width="4.5"/>
        <path d="M402 784 C420 792 448 792 466 784"/>
        <path d="M424 808 C431 814 441 814 448 808"/>
        <path d="M398 836 L402 842 M470 836 L466 842" stroke-width="5.5"/>
      </g>
      <g fill="#232323">
        <path class="pupil" d="M364 621 a7.5 7.5 0 0 0 15 0 Z"/>
        <path class="pupil" d="M485 621 a7.5 7.5 0 0 0 15 0 Z"/>
      </g>
    </g>
  </defs>
  <g filter="url(#brush)">
    <use href="#face"/>
    <g fill="none" stroke="#232323" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.5">
      <!-- neck, finishing in two soft shoulder lines -->
      <path d="M338 818 C340 858 343 896 345 930"/>
      <path d="M532 812 C530 852 530 884 528 912"/>
      <path d="M345 930 C324 948 296 962 266 974"/>
      <path d="M528 912 C552 928 582 940 610 948"/>
    </g>
  </g>
  <g class="strand strand--crown" filter="url(#brush)"><path fill="none" stroke="#232323" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.5" d="M378 432 C371 424 362 421 353 423"/></g>
  <g class="strand strand--right" filter="url(#brush)"><path fill="none" stroke="#232323" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.5" d="M592 712 C598 735 596 760 586 780"/></g>
  <g class="strand strand--left" filter="url(#brush)"><path fill="none" stroke="#232323" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.5" d="M290 712 C286 730 290 745 298 758"/></g>
</svg>
